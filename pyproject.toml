[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "media-optimizer"
version = "1.0.0"
description = "Otimizador Profissional de Fotos e Vídeos (Zero Setup, Alta Performance)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm Noncommercial 1.0.0" }
authors = [
    { name = "Paulo / murphases", email = "contato@example.com" }
]
keywords = ["photos", "videos", "optimizer", "converter", "heic", "raw", "google-photos", "takeout"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "pillow>=10.0.0",
    "pillow-heif>=0.13.0",
    "tqdm>=4.65.0",
    "psutil>=5.9.0",
    "customtkinter>=5.2.0",
    "darkdetect>=0.8.0",
]

[project.optional-dependencies]
raw = ["rawpy>=0.20.0", "numpy>=1.24.0"]
nvidia = ["nvidia-ml-py>=12.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "pyinstaller>=6.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
media-optimizer = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=media_optimizer --cov-report=term-missing --cov-report=xml --cov-fail-under=100"

[tool.coverage.run]
source = ["media_optimizer"]
omit = [
    "media_optimizer/gui.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "except ImportError:",
    "^\\s*except ImportError:.*$",
    "^\\s*except Exception:.*$",
    "^\\s*pass\\s*$",
]
